services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: smartleave_backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=smartleave
      - DB_USERNAME=smartleave
      - DB_PASSWORD=smartleave_secure_pass
      - REDIS_HOST=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - mysql
      - redis
      - mailpit

  frontend:
    image: node:20-alpine
    container_name: smartleave_frontend
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: smartleave_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=smartleave
      - MYSQL_USER=smartleave
      - MYSQL_PASSWORD=smartleave_secure_pass
      - MYSQL_ROOT_PASSWORD=root_secure_pass
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: smartleave_redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: smartleave_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
